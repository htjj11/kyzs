<svg width="256" height="256" viewBox="0 0 256 256" xmlns="http://www.w3.org/2000/svg" role="img">
  <title>科研情报系统</title>
  <desc>科研情报系统图标，放大镜与数据网络节点组合</desc>

  <!-- 背景 -->
  <rect width="256" height="256" rx="48" fill="#0F172A"/>

  <!-- 外扫描环 -->
  <circle cx="128" cy="128" r="100" fill="none" stroke="#3B82F6" stroke-width="1.5" stroke-dasharray="6 3" opacity="0.5"/>
  <circle cx="128" cy="128" r="80" fill="none" stroke="#60A5FA" stroke-width="1" stroke-dasharray="4 4" opacity="0.3"/>

  <!-- 内圆底盘 -->
  <circle cx="128" cy="128" r="58" fill="#1E3A5F" stroke="#3B82F6" stroke-width="2"/>

  <!-- 扫描弧光 -->
  <path d="M128 128 L128 70 A58 58 0 0 1 178 168 Z" fill="#3B82F6" opacity="0.1"/>

  <!-- 放大镜镜圆 -->
  <circle cx="120" cy="120" r="26" fill="#0F172A" stroke="#60A5FA" stroke-width="3"/>
  <!-- 镜内光圈 -->
  <circle cx="120" cy="120" r="17" fill="none" stroke="#93C5FD" stroke-width="1" opacity="0.5"/>
  <!-- 镜内数据点 -->
  <circle cx="120" cy="120" r="6" fill="#60A5FA"/>
  <!-- 高光 -->
  <circle cx="115" cy="115" r="3" fill="#BFDBFE" opacity="0.6"/>
  <!-- 把手 -->
  <line x1="141" y1="141" x2="158" y2="158" stroke="#60A5FA" stroke-width="5" stroke-linecap="round"/>

  <!-- 辐射连线 上下左右 -->
  <line x1="128" y1="70" x2="128" y2="56" stroke="#3B82F6" stroke-width="2" stroke-linecap="round"/>
  <line x1="128" y1="186" x2="128" y2="200" stroke="#3B82F6" stroke-width="2" stroke-linecap="round"/>
  <line x1="70" y1="128" x2="56" y2="128" stroke="#3B82F6" stroke-width="2" stroke-linecap="round"/>
  <line x1="186" y1="128" x2="200" y2="128" stroke="#3B82F6" stroke-width="2" stroke-linecap="round"/>

  <!-- 辐射连线 斜向 -->
  <line x1="87" y1="87" x2="75" y2="75" stroke="#3B82F6" stroke-width="1.5" stroke-linecap="round" opacity="0.6"/>
  <line x1="169" y1="169" x2="181" y2="181" stroke="#3B82F6" stroke-width="1.5" stroke-linecap="round" opacity="0.6"/>
  <line x1="169" y1="87" x2="181" y2="75" stroke="#3B82F6" stroke-width="1.5" stroke-linecap="round" opacity="0.6"/>
  <line x1="87" y1="169" x2="75" y2="181" stroke="#3B82F6" stroke-width="1.5" stroke-linecap="round" opacity="0.6"/>

  <!-- 主节点 上下左右 -->
  <circle cx="128" cy="54" r="7" fill="#1D4ED8" stroke="#60A5FA" stroke-width="2"/>
  <circle cx="128" cy="202" r="7" fill="#1D4ED8" stroke="#60A5FA" stroke-width="2"/>
  <circle cx="54" cy="128" r="7" fill="#1D4ED8" stroke="#60A5FA" stroke-width="2"/>
  <circle cx="202" cy="128" r="7" fill="#1D4ED8" stroke="#60A5FA" stroke-width="2"/>

  <!-- 次级节点 斜向 -->
  <circle cx="73" cy="73" r="5" fill="#2563EB" stroke="#93C5FD" stroke-width="1.5"/>
  <circle cx="183" cy="183" r="5" fill="#2563EB" stroke="#93C5FD" stroke-width="1.5"/>
  <circle cx="183" cy="73" r="5" fill="#2563EB" stroke="#93C5FD" stroke-width="1.5"/>
  <circle cx="73" cy="183" r="5" fill="#2563EB" stroke="#93C5FD" stroke-width="1.5"/>
</svg>
